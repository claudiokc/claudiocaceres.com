# Checks every pull request and every push to master.
# Deploys are done by Cloudflare Pages' own Git integration (production from master,
# a preview URL for every other branch), not by this workflow.
name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: |
          for f in index.html _headers _routes.json llms.txt robots.txt; do
            test -f "build/$f" || { echo "Missing build/$f"; exit 1; }
          done
